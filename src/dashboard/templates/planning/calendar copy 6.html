<style>

    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f4f4f4;
    }
    
    .week-calendar {
        width: 100%;
        max-width: 1000px;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        overflow: hidden;
        padding: 20px;
    }
    
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #3b5998;
        color: #fff;
        padding: 15px;
        font-size: 18px;
        margin-bottom: 10px;
    }
    
    .week-selector {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
    }
    
    .week-selector input {
        margin-left: 10px;
        padding: 5px;
        font-size: 16px;
    }
    
    .days {
        display: flex;
        align-items: flex-start;
        overflow-x: auto;
    }
    
    .day {
        flex: 1;
        padding: 10px;
        border-right: 1px solid #e4e4e4;
        text-align: left;
        min-width: 150px;
    }
    
    .day:last-child {
        border-right: none;
    }
    
    .task {
        margin-top: 10px;
        color: #3b5998;
        display: flex;
        justify-content: space-between;
    }
    
    .name-column {
        width: 150px;
        padding: 10px;
        background-color: #f0f0f0;
        text-align: center;
        font-weight: bold;
        border-right: 1px solid #e4e4e4;
    }
    
    
</style>



<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Hebdomadaire</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="week-calendar">
        <div class="header">
            <button id="prevWeek">Précédent</button>
            <div id="weekInfo"></div>
            <button id="nextWeek">Suivant</button>
        </div>
        <div class="week-selector">
            <label for="weekInput">Choisir une semaine :</label>
            <input type="week" id="weekInput">
            <button id="goToWeek">Aller</button>
        </div>
        <div class="days" id="weekDays"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>




<script type="text/javascript">
    const weekDays = document.getElementById('weekDays');
const weekInfo = document.getElementById('weekInfo');
const prevWeek = document.getElementById('prevWeek');
const nextWeek = document.getElementById('nextWeek');
const weekInput = document.getElementById('weekInput');
const goToWeek = document.getElementById('goToWeek');

let currentWeek = getWeekNumber(new Date());

const tasks = {
    "2024-08-12": [
        { time: "08:00", task: "Réunion avec l'équipe" },
        { time: "10:00", task: "Appel client" },
        { time: "14:00", task: "Préparation du rapport" },
        { time: "16:00", task: "Réunion de suivi" }
    ],
    "2024-08-13": [
        { time: "09:00", task: "Réunion projet X" },
        { time: "11:00", task: "Vérification des emails" }
    ],
    // Ajoutez plus de tâches ici...
};

function renderWeek(week, year) {
    const startOfWeek = getDateOfISOWeek(week, year);
    const days = [];
    for (let i = 0; i < 7; i++) {
        const day = new Date(startOfWeek);
        day.setDate(startOfWeek.getDate() + i);
        days.push(day);
    }

    weekInfo.textContent = `Semaine ${week}`;
    weekDays.innerHTML = '';

    const nameColumn = document.createElement('div');
    nameColumn.classList.add('name-column');
    nameColumn.textContent = 'Dupont David';
    weekDays.appendChild(nameColumn);

    days.forEach((day) => {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');

        const dateKey = day.toISOString().split('T')[0];
        const dayTasks = tasks[dateKey] || [];

        dayDiv.innerHTML = `<strong>${day.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</strong>`;
        
        dayTasks.forEach(task => {
            const taskDiv = document.createElement('div');
            taskDiv.classList.add('task');
            taskDiv.innerHTML = `<span>${task.time}</span><span>${task.task}</span>`;
            dayDiv.appendChild(taskDiv);
        });

        weekDays.appendChild(dayDiv);
    });
}

function getWeekNumber(d) {
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function getDateOfISOWeek(week, year) {
    const simple = new Date(year, 0, 1 + (week - 1) * 7);
    const dayOfWeek = simple.getDay();
    const ISOweekStart = simple;
    if (dayOfWeek <= 4)
        ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
    else
        ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
    return ISOweekStart;
}

prevWeek.addEventListener('click', () => {
    currentWeek--;
    if (currentWeek < 1) {
        currentWeek = 52;
    }
    renderWeek(currentWeek, new Date().getFullYear());
});

nextWeek.addEventListener('click', () => {
    currentWeek++;
    if (currentWeek > 52) {
        currentWeek = 1;
    }
    renderWeek(currentWeek, new Date().getFullYear());
});

goToWeek.addEventListener('click', () => {
    const [year, week] = weekInput.value.split('-W');
    renderWeek(parseInt(week), parseInt(year));
});

renderWeek(currentWeek, new Date().getFullYear());

</script>
