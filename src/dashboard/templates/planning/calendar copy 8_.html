<style>

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
    }
    
    .week-calendar {
        width: 100%;
        max-width: 1200px;
        margin: 20px auto;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }
    
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #3b5998;
        color: #fff;
        padding: 10px 20px;
        font-size: 18px;
    }
    
    .calendar-grid {
        display: grid;
        grid-template-columns: 150px repeat(7, 1fr);
        gap: 1px;
        background-color: #ddd;
    }
    
    .header-row {
        display: contents;
    }
    
    .name-column,
    .day-column {
        background-color: #f7f7f7;
        padding: 10px;
        font-weight: bold;
        text-align: center;
    }
    
    .task-row {
        display: grid;
        grid-template-columns: 150px repeat(7, 1fr);
        gap: 1px;
    }
    
    .name-cell,
    .task-cell {
        background-color: #fff;
        padding: 10px;
        border-bottom: 1px solid #ddd;
    }
    
    .task {
        margin-bottom: 5px;
        padding: 5px;
        border-radius: 4px;
        color: #fff;
        text-align: center;
    }
    
</style>


<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Hebdomadaire Dynamique</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="week-calendar">
        <div class="header">
            <button id="prevWeek">❮</button>
            <div id="weekInfo">Semaine 34</div>
            <button id="nextWeek">❯</button>
        </div>
        <div class="calendar-grid">
            <div class="header-row">
                <div class="name-column"></div>
                <div class="day-column">Lundi 15</div>
                <div class="day-column">Mardi 16</div>
                <div class="day-column">Mercredi 17</div>
                <div class="day-column">Jeudi 18</div>
                <div class="day-column">Vendredi 19</div>
                <div class="day-column">Samedi 20</div>
                <div class="day-column">Dimanche 21</div>
            </div>
            <div id="calendarContent">
                <!-- Les tâches seront générées ici dynamiquement -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>








<script type="text/javascript">
    const weekInfo = document.getElementById('weekInfo');
const prevWeek = document.getElementById('prevWeek');
const nextWeek = document.getElementById('nextWeek');
const calendarContent = document.getElementById('calendarContent');

let currentWeek = 34;

const tasks = {
    "34": [
        {
            person: "DJOLOGUE Kanfiguin",
            tasks: [
                { day: 0, time: "08:00", task: "Tâche 1", color: "#b2dfdb" },
                { day: 4, time: "16:00", task: "Tâche 2", color: "#ffccbc" }
            ]
        },
        {
            person: "LARE Yambambate",
            tasks: [
                { day: 1, time: "12:00", task: "Tâche 3", color: "#c5cae9" }
            ]
        },
        {
            person: "YAMBA Wassila",
            tasks: [
                { day: 2, time: "08:00", task: "Tâche 4", color: "#ffe0b2" }
            ]
        },
        {
            person: "DJABONE Minlibe",
            tasks: [
                { day: 3, time: "10:00", task: "Tâche 5", color: "#ffab91" }
            ]
        }
    ]
};

function renderCalendar(week) {
    calendarContent.innerHTML = '';
    const weekData = tasks[week] || [];
    weekData.forEach(personData => {
        const nameCell = document.createElement('div');
        nameCell.classList.add('name-cell');
        nameCell.textContent = personData.person;

        calendarContent.appendChild(nameCell);

        for (let i = 0; i < 7; i++) {
            const taskCell = document.createElement('div');
            taskCell.classList.add('task-cell');
            const taskData = personData.tasks.find(task => task.day === i);
            if (taskData) {
                const task = document.createElement('div');
                task.classList.add('task');
                task.style.backgroundColor = taskData.color;
                task.textContent = `${taskData.time} - ${taskData.task}`;
                taskCell.appendChild(task);
            }
            calendarContent.appendChild(taskCell);
        }
    });
    weekInfo.textContent = `Semaine ${week}`;
}

prevWeek.addEventListener('click', () => {
    currentWeek--;
    renderCalendar(currentWeek);
});

nextWeek.addEventListener('click', () => {
    currentWeek++;
    renderCalendar(currentWeek);
});

renderCalendar(currentWeek);





</script>
