<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f4f4f4;
    }
    
    .week-calendar {
        width: 400px;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        overflow: hidden;
    }
    
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #3b5998;
        color: #fff;
        padding: 15px;
        font-size: 18px;
    }
    
    .days {
        display: flex;
        flex-direction: column;
    }
    
    .day {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #e4e4e4;
    }
    
    .day:last-child {
        border-bottom: none;
    }
    
    .task {
        margin-left: 10px;
        color: #3b5998;
    }
    
    
</style>


<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Hebdomadaire</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="week-calendar">
        <div class="header">
            <button id="prevWeek">Précédent</button>
            <div id="weekInfo"></div>
            <button id="nextWeek">Suivant</button>
        </div>
        <div class="days" id="weekDays"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>



<script type="text/javascript">
    const weekDays = document.getElementById('weekDays');
const weekInfo = document.getElementById('weekInfo');
const prevWeek = document.getElementById('prevWeek');
const nextWeek = document.getElementById('nextWeek');

let currentWeek = getWeekNumber(new Date());

function renderWeek(week, year) {
    const startOfWeek = getDateOfISOWeek(week, year);
    const days = [];
    for (let i = 0; i < 7; i++) {
        const day = new Date(startOfWeek);
        day.setDate(startOfWeek.getDate() + i);
        days.push(day);
    }

    weekInfo.textContent = `Semaine ${week}`;
    weekDays.innerHTML = '';

    days.forEach((day) => {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        dayDiv.textContent = `${day.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}`;
        
        const taskDiv = document.createElement('div');
        taskDiv.classList.add('task');
        taskDiv.textContent = 'Pas de tâche planifiée'; // Placeholder pour des tâches
        dayDiv.appendChild(taskDiv);

        weekDays.appendChild(dayDiv);
    });
}

function getWeekNumber(d) {
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function getDateOfISOWeek(week, year) {
    const simple = new Date(year, 0, 1 + (week - 1) * 7);
    const dayOfWeek = simple.getDay();
    const ISOweekStart = simple;
    if (dayOfWeek <= 4)
        ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
    else
        ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
    return ISOweekStart;
}

prevWeek.addEventListener('click', () => {
    currentWeek--;
    if (currentWeek < 1) {
        currentWeek = 52;
    }
    renderWeek(currentWeek, new Date().getFullYear());
});

nextWeek.addEventListener('click', () => {
    currentWeek++;
    if (currentWeek > 52) {
        currentWeek = 1;
    }
    renderWeek(currentWeek, new Date().getFullYear());
});

renderWeek(currentWeek, new Date().getFullYear());

    

</script>
