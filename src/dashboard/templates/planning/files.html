{% load static i18n custom_tags %}

<div class="d-flex flex-wrap">
{% for file in files %}
    <div class="p-2">
        
        <div class="image-container" style="position: relative; display: inline-block;">
            <img src="{{ file.url|imgAWSS3Filter }}" width="100" height="100" />
            {% if user.email == user_email or user.username == file.username %}
            <i 
                id="{{ file.id }}"
                class="fas fa-times text-danger img-croix" 
                style="font-size: 17px; position: absolute; top: 5px; right: 5px; cursor: pointer; z-index: 9;"></i>
            {% endif %}
            <a href="{% url 'download_from_url' %}?url={{ file.url|imgAWSS3Filter }}" target="_blank" 
                style="font-size: 17px; position: absolute; top: 5px; left: 5px; cursor: pointer; z-index: 9;" >
                <i class="fas fa-eye text-info" ></i>
            </a>
        </div>
        
    </div>
{% empty %}

    <div class="col-12 text-center">
        {% translate 'No files found' %}
    </div>
        
{% endfor %}
</div>


<script type="text/javascript">

    $(document).ready(function () {
        $('.img-croix').click(function () {
            $("#file_sync_msg").html('{% translate "Seletion in progress..." %}');
            $.ajax({
                type: "POST",
                url: "{% url 'dashboard:planning:delete_file_to_plan_task' %}",
                data: {
                    "file__id": this.id,
                    "task__id": "{{ task__id }}",
                },
                success: function (response) {
                    if(response.files){
                        $("#file_sync_msg").html('{% translate "The file was successfully deleted." %}');
                        loadFiles("{{ no_sql_db_name }}", "{{ task__id }}");
                    }else{
                        $("#file_sync_msg").html(`{% translate "The file was not successfully saved." %}`);
                    }
                    setTimeout(function(){
                        $("#file_sync_msg").html('');
                    }, 3000);
                },
                error: function (data, status, error) {
                    if(error == "Forbidden"){
                        alert(`{% translate "You don't have permission to request this request." %}` + " Error " + data.status);
                    }else{
                        alert(error_server_message + "Error " + data.status);
                    }
                }
            });
        });
    });
</script>
