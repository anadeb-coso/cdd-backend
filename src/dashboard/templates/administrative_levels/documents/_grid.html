{% load i18n %}
{% comment %}
    Une page de la grille de la galerie (GALLERY_PAGE_SIZE cartes) — rendu dans la page
    complète (attachments.html) ET seul, comme fragment, pour le défilement infini :
    AttachmentListView.get_template_names renvoie CE gabarit (jamais la page complète, dont
    les <script> seraient réexécutés) aux requêtes htmx (en-tête HX-Request).
    Défilement infini : le repère `.gallery-sentinel` placé APRÈS la grille charge la page
    suivante quand il devient visible et est remplacé par elle (hx-swap="outerHTML"), le
    fragment reçu apportant à son tour son propre repère s'il reste des pages. Le repère est
    en fin de grille (et non sur la grille elle-même, visible dès l'arrivée) pour ne charger
    la page suivante qu'une fois le bas de la page atteint.
{% endcomment %}
<div class="gallery-grid">
    {% for attachment in attachments %}
        {% include 'administrative_levels/documents/_attachment_card_content.html' with attachment=attachment %}
    {% endfor %}

    {% if no_results %}
        <div class="gallery-empty" style="grid-column: 1 / -1;">
            <i class="fas fa-images"></i>
            <div class="font-weight-bold">{% translate 'No attachments match your filters' %}</div>
            <div class="small">{% translate 'Try clearing a filter or selecting a different type.' %}</div>
        </div>
    {% endif %}
</div>
{% if next_page_url %}
    <div class="gallery-sentinel"
         hx-get="{{ next_page_url }}"
         hx-trigger="revealed"
         hx-swap="outerHTML"
         hx-indicator="#gallery-loading"></div>
{% endif %}
