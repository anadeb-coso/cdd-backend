<script type="text/javascript">
        
    function set_datas_selected_fields(element, data){
        v = element.val();
        element.html('');
        $(element).next().find('b[role="presentation"]').hide();
        
        let options = '';

        options += '<option value=""></option>';

        $.each(data, function (index, value) {
            let option = '<option value="' + value.id + '"';
            if(v == value.name){
                option += ' selected>';
            }else{
                option += '>';
            }
            
            option += value.name + '</option>';
            options += option
        });


        element.html(options);
        element.trigger('change');
        let element_val = element.val();
        if (element_val !== '') {
            element.val(element_val)
        }
    }
</script>

<script src="{% static 'js/notifications.js' %}"></script>
{{ INVALIDATION_NOTIFICATIONS|json_script:"invalidations-data" }}
<script type="text/javascript">
    let spans = "";
    const INVALIDATION_NOTIFICATIONS = JSON.parse(
    document.getElementById("invalidations-data").textContent
    );
    Object.entries(INVALIDATION_NOTIFICATIONS).forEach(([project, vals]) => {
    Object.entries(vals).forEach(([cycle, v]) => {
        if (cycle !== "project_id") {

        if (v.total_tasks_waiting_validation) {
            spans += `<span>${v.total_tasks_waiting_validation} - {% translate 'Tasks Completed (Awaiting validation)' %} [${project}] [${cycle}]</span><hr />`;
        }

        if (v.total_tasks_invalidated_review_completed) {
            spans += `<span>${v.total_tasks_invalidated_review_completed} - {% translate 'Tasks reviewed by the facilitators are awaiting validation' %} [${project}] [${cycle}]</span><hr />`;
        }

        }
    });
    });
    {% if user|has_group:"Supervisor" %}
        pushNotify(spans, "error");
    {% endif %}
</script>
