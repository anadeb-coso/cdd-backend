{% load i18n %}{% comment %}
    Visionneuse des pièces jointes COSOCollect : s'ouvre au clic sur un lien `.js-cc-view` (voir
    _attachment_actions_links.html) ; photo en grand, PDF (ou Word converti en PDF) dans un cadre.
{% endcomment %}
<div class="modal fade" id="cc-viewer" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title text-truncate" id="cc-viewer-title"></h6>
                <button type="button" class="close" data-dismiss="modal" aria-label="{% translate 'Close' %}"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body p-0 cc-viewer-body" id="cc-viewer-body"></div>
            <div class="modal-footer py-2">
                <a class="btn btn-sm btn-outline-secondary" id="cc-viewer-open" target="_blank" rel="noopener"><i class="fas fa-external-link-alt mr-1"></i>{% translate "Open in a new tab" %}</a>
                <a class="btn btn-sm btn-outline-primary" id="cc-viewer-download"><i class="fas fa-download mr-1"></i>{% translate "Download" %}</a>
                <a class="btn btn-sm btn-outline-success" id="cc-viewer-convert"></a>
            </div>
        </div>
    </div>
</div>
<script>
    $(function () {
        $(document).on("click", ".js-cc-view", function (e) {
            e.preventDefault();
            var d = $(this).data(), $body = $("#cc-viewer-body").empty();
            $("#cc-viewer-title").text(d.name || "");
            if (d.kind === "image") {
                $body.append($("<img>", {src: d.viewUrl, alt: d.name || "", "class": "cc-viewer-img"}));
            } else {
                if (d.kind === "word") {
                    $body.append($("<div>", {"class": "small text-muted px-3 py-1", text: "{% translate 'Word document shown converted to PDF: the conversion can take a few seconds.' %}"}));
                }
                $body.append($("<iframe>", {src: d.viewUrl, "class": "cc-viewer-frame", title: d.name || ""}));
            }
            $("#cc-viewer-open").attr("href", d.viewUrl);
            $("#cc-viewer-download").attr("href", d.downloadUrl);
            if (d.convertUrl) {
                $("#cc-viewer-convert").attr("href", d.convertUrl).show()
                    .html('<i class="fas ' + (d.kind === "pdf" ? "fa-file-word" : "fa-file-pdf") + ' mr-1"></i>' + $("<span>").text(d.convertLabel).html());
            } else {
                $("#cc-viewer-convert").hide();
            }
            $("#cc-viewer").modal("show");
        });
        // Clic sur une vignette : même chose que « Voir en grand » de la même pièce jointe.
        $(document).on("click", ".cc-thumb-view", function (e) {
            e.preventDefault();
            $(this).closest(".cc-gallery-item, .cc-field-value").find(".js-cc-view").first().trigger("click");
        });
        $("#cc-viewer").on("hidden.bs.modal", function () { $("#cc-viewer-body").empty(); });
    });
</script>
