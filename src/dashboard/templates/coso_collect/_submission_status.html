{% load i18n %}{% if submission.status == 'submitted' %}<span class="cc-pill cc-sub-submitted"><i class="fas fa-check"></i> {% translate "Sent" %}</span>{% elif submission.status == 'completed' %}<span class="cc-pill cc-sub-completed"><i class="fas fa-clipboard-check"></i> {% translate "Filled in" %}</span>{% else %}<span class="cc-pill cc-sub-draft"><i class="fas fa-hourglass-half"></i> {% translate "Started" %}</span>{% endif %}{% if submission.editable %} <span class="cc-pill cc-sub-editable" title="{% translate 'Reopened for modification by an administrator' %}"><i class="fas fa-lock-open"></i> {% translate "Reopened" %}</span>{% endif %}
